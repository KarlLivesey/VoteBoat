[package]
name = "voteboat"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "RPL-1.5"
description = "Native-first composable consensus runtime, under development"
repository = "https://github.com/KarlLivesey/VoteBoat"
publish = false

[features]
default = ["native"]
native = []

[[example]]
name = "durable_vote"
required-features = ["native"]

[workspace]
exclude = ["VoteBoat-Design-Pack/reference-rust"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
