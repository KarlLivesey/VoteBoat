name: Platform feedback
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-feedback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo fetch --locked
      - run: cargo test --locked --offline
      - run: cargo test --locked --offline --no-default-features
      - run: cargo test --locked --offline --no-default-features --features native
      - run: cargo clippy --locked --offline --all-targets -- -D warnings
