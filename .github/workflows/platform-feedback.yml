name: Platform feedback
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-feedback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Rust formatting and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo fetch --locked
      - run: cargo clippy --locked --offline --keep-going --all-targets -- -D warnings
      - run: cargo clippy --locked --offline --keep-going --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --offline --keep-going --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --offline --keep-going --all-targets --no-default-features --features native -- -D warnings
  test:
    name: Rust all-features on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fetch --locked
      - name: Test all-features
        shell: bash
        run: |
          set -e
          compiler="$(bash validation/reference-tools.sh)"
          if [[ -n "$compiler" ]]; then export PROTOC="$compiler"; fi
          # Native fixtures can retain more than the inherited macOS fd limit.
          if [[ "$RUNNER_OS" == macOS ]]; then ulimit -n 4096; fi
          status=0
          cargo test --locked --offline --no-fail-fast --all-features || status=$?
          printf 'all-features exit: %s\n' "$status"
          exit "$status"

  test_no_default:
    name: Rust no-default-features on ${{ matrix.os }}
    needs: test
    # Continue after a failed/timed-out dependency; honor manual cancellation.
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fetch --locked
      - name: Test no-default-features
        shell: bash
        run: |
          set -e
          compiler="$(bash validation/reference-tools.sh)"
          if [[ -n "$compiler" ]]; then export PROTOC="$compiler"; fi
          # Native fixtures can retain more than the inherited macOS fd limit.
          if [[ "$RUNNER_OS" == macOS ]]; then ulimit -n 4096; fi
          status=0
          cargo test --locked --offline --no-fail-fast --no-default-features || status=$?
          printf 'no-default-features exit: %s\n' "$status"
          exit "$status"

  test_native:
    name: Rust native-only on ${{ matrix.os }}
    needs: test_no_default
    # Continue after a failed/timed-out dependency; honor manual cancellation.
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fetch --locked
      - name: Test native-only
        shell: bash
        run: |
          set -e
          compiler="$(bash validation/reference-tools.sh)"
          if [[ -n "$compiler" ]]; then export PROTOC="$compiler"; fi
          # Native fixtures can retain more than the inherited macOS fd limit.
          if [[ "$RUNNER_OS" == macOS ]]; then ulimit -n 4096; fi
          status=0
          cargo test --locked --offline --no-fail-fast --no-default-features --features native || status=$?
          printf 'native-only exit: %s\n' "$status"
          exit "$status"
