name: Platform feedback
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-feedback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Rust formatting and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo fetch --locked
      - run: cargo clippy --locked --offline --keep-going --all-targets -- -D warnings
      - run: cargo clippy --locked --offline --keep-going --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --offline --keep-going --all-targets --no-default-features -- -D warnings
      - run: cargo clippy --locked --offline --keep-going --all-targets --no-default-features --features native -- -D warnings
  test:
    name: Rust on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fetch --locked
      - name: Test feature configurations sequentially
        shell: bash
        run: |
          set -e
          # Native three-node/100-group fixtures retain 300 snapshot-store locks.
          # macOS shells can inherit a 256-file limit; adjust this step only.
          if [[ "$RUNNER_OS" == macOS ]]; then ulimit -n 4096; fi
          cargo test --locked --offline --all-features
          cargo test --locked --offline --no-default-features
          cargo test --locked --offline --no-default-features --features native
